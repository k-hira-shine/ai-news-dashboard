<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting to AI News Collector</title>
  <script>
    (function () {
      var canonicalBase = "https://k-hira-shine.github.io/ai-news-collector/";
      var prefix = "/ai-news-dashboard/";
      var path = window.location.pathname || prefix;
      var suffix = path.indexOf(prefix) === 0 ? path.slice(prefix.length) : "";
      var target = canonicalBase + suffix + window.location.search + window.location.hash;
      window.location.replace(target);
    }());
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://k-hira-shine.github.io/ai-news-collector/">AI News Collector</a>.</p>
</body>
</html>
